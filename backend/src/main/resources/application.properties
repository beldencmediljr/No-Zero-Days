spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../backend/.env[.properties],optional:file:../.env[.properties]

# ─── Database & Production Configuration ──────────────────────────────────────
# Uses Railway-injected environment variables when deployed.
# For local development, falls back to local MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/no_zero_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Scaled for 50+ concurrent classroom users)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server port (Railway injects $PORT automatically)
server.port=${PORT:8080}

# Frontend origin used when building links (e.g., password reset emails)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# --------------------------------------------------------------------------
# Google OAuth 2.0 Configuration (Official Gmail API)
# Loaded dynamically from environment variables or .env file
# --------------------------------------------------------------------------
google.oauth2.client-id=${GOOGLE_OAUTH2_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET:}
google.oauth2.refresh-token=${GOOGLE_OAUTH2_REFRESH_TOKEN:}
google.oauth2.sender-email=${GOOGLE_OAUTH2_SENDER_EMAIL:}

# --------------------------------------------------------------------------
# System Mail SMTP Relay Configuration (Fallback)
# --------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
